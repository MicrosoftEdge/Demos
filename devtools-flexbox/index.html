<!DOCTYPE html>
<html lang="en">

<head>
  <title>Inspect and debug CSS flexbox</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://edgestatic.azureedge.net/welcome/static/favicon.png">
  <style>
    html {
      font-family: system-ui;
      font-size: 1.1em;
    }

    body {
      margin: 0;
      padding: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: normal;
    }

    .container {
      display: flex;
      block-size: 10rem;
      padding: 1rem;
      background: lightblue;
      border-radius: 1rem;
    }

    .container h1 {
      background: white;
      padding: 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Flexbox</h1>
  </div>
</body>

</html>
